services:
  yt-converter:
    build:
      context: .
      network: host
      args:
        YTDLP_VERSION: "2026.10.26"
    image: gmod-yt-converter:latest
    container_name: yt-converter
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-9999}:9999"
    env_file:
      - .env
    environment:
      PORT: "9999"
      DATA_DIR: /app/data
      CACHE_DIR: /app/cache
      COOKIES_FILE: /app/cookies/cookies.txt
    volumes:
      - ./data:/app/data
      - ./cache:/app/cache
      # read-only is fine now: every yt-dlp run gets its own temporary copy
      - ./cookies:/app/cookies:ro
    dns:
      - 8.8.8.8
      - 1.1.1.1
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETUID
      - SETGID
    tmpfs:
      - /tmp
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # optional hard caps, uncomment to protect the host
    # deploy:
    #   resources:
    #     limits:
    #       cpus: "2.0"
    #       memory: 1g
